services:
  postgres:
    image: postgres:16-alpine
    container_name: users-api-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  users-api:
    build: .
    image: users-api:latest
    container_name: users-api
    ports:
      - "${API_PORT:-8081}:${API_PORT:-8081}"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      # Containers talk to each other over the internal Docker network on
      # Postgres's real port (5432), regardless of what POSTGRES_PORT is
      # remapped to on the host in .env.
      POSTGRES_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
